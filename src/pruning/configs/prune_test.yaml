seed: 0
device: mps
exp_name: prune_test
output_dir: 'src/out'
model_path: 'models/count-%2l4h256d4lr01drop'
init_sample_param: 8  # sigmoid(8) approx 1
lr_sampler_for_pruning: 0.1
lr_ln_var_for_pruning: 0.1
lr_oa_for_pruning: 0.002
lr_mlp_for_pruning: 0.001
relative_gap: 0.9

pruning_stages:

  stage1:
    linear_ln: True
    lamb: 0.000001
    auto_lamb: true
    num_steps: 100
    train_batch_size: 120
    mini_batch_size: 30
    test_batch_size: 120
    num_repeat: 12
    lamb_search:
      probe_num_steps: 25
      max_probes: 3

  stage2:
    split_mlp: True
    lamb: 0.00001
    auto_lamb: true
    num_steps: 50
    num_repeat: 12
    train_batch_size: 120
    mini_batch_size: 20
    test_batch_size: 120
    lamb_search:
      probe_num_steps: 25
      max_probes: 3

  stage3:
    lamb: 0.00000065
    auto_lamb: true
    num_steps: 50
    num_repeat: 12
    train_batch_size: 120
    mini_batch_size: 20
    test_batch_size: 120
    lamb_search:
      probe_num_steps: 25
      max_probes: 3

task_config:
  name: counting
  train_length_range: [0, 150]
  val_length_range: [0, 150]
  max_test_length: 150